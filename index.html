<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}html,body{margin:0}body{font:14px system-ui,sans-serif}</style>
</head>
<body>
<title>Walkthrough Unit Mawar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: full-bleed first-person view; slim controls float over it, plan minimap bottom-right.
   Palette: lake-teal accent on warm-grey neutrals. Type: Public Sans (UI) + IBM Plex Mono (plan data). */
:root{
  --bg:#e7e4de;
  --panel:rgba(250,248,244,.93);
  --fg:#1d2421;
  --muted:#5a635d;
  --accent:#17695d;
  --accent-fg:#ffffff;
  --line:rgba(29,36,33,.16);
  --chip:#f0ede6;
  --chip-on:#17695d;
  --font-ui:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121618;
    --panel:rgba(24,30,31,.92);
    --fg:#ecefe9;
    --muted:#a3ada6;
    --accent:#5cc7b2;
    --accent-fg:#06211c;
    --line:rgba(236,239,233,.2);
    --chip:#222a2b;
    --chip-on:#5cc7b2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121618;
  --panel:rgba(24,30,31,.92);
  --fg:#ecefe9;
  --muted:#a3ada6;
  --accent:#5cc7b2;
  --accent-fg:#06211c;
  --line:rgba(236,239,233,.2);
  --chip:#222a2b;
  --chip-on:#5cc7b2;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;overflow:hidden}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg);touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl:active{cursor:grabbing}
.top{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none;min-width:0}
.top > *{pointer-events:auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.head h1{font-size:15px;font-weight:600;margin:0;line-height:1.25;text-wrap:balance}
.head .sub{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:2px}
.mode{flex:none;font:inherit;font-weight:500;font-size:13px;color:var(--accent-fg);background:var(--accent);border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.mode:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;font:inherit;font-size:13px;color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--accent-fg);border-color:transparent}
.hint{align-self:flex-start;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;max-width:100%}
.room{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-weight:600;font-size:14px;white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.mm{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.mm canvas{display:block;width:210px;height:auto;border-radius:6px}
.mm p{margin:0;font-size:10.5px;line-height:1.35;color:var(--muted);max-width:210px}
#joy{position:absolute;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:none;touch-action:none}
#knob{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;background:var(--accent);opacity:.9}
@media (pointer:coarse){#joy{display:block}}
@media (max-width:620px){
  .mm canvas,.mm p{width:140px;max-width:140px}
  .mm p{display:none}
  .room{bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:80%}
  .head .sub{display:none}
}
#fail{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--bg);color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div id="app">
  <canvas id="gl" aria-label="Paparan 3D dalam unit"></canvas>
  <div class="top">
    <div class="head">
      <div>
        <h1>Residensi Madani Mawar · Unit A &amp; A1</h1>
        <div class="sub">3 bilik tidur · 2 bilik air · 800 kp</div>
      </div>
      <button class="mode" id="mode" type="button">Pandangan atas</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Pergi ke ruang"></div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="room" id="room" aria-live="polite">Foyer</div>
  <div class="mm">
    <canvas id="mm" width="420" height="290" aria-label="Pelan unit dengan kedudukan anda"></canvas>
    <p>Pelan ilustrasi daripada brosur. Ukuran, perabot dan bahan dianggar.</p>
  </div>
  <div id="joy"><div id="knob"></div></div>
  <div id="fail"><p>Paparan 3D memerlukan WebGL. Cuba buka halaman ini dalam Chrome, Edge, Safari atau Firefox terkini.</p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var S=0.0105, OX=807, OY=356, WH=2.7, EYE=1.55, RAD=0.22;       // 1 px pelan = 1.05 cm
  function X(px){return (px-OX)*S;} function Z(py){return (py-OY)*S;}
  var canvas=document.getElementById('gl');
  var renderer;
  try{
    renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
  }catch(e){ document.getElementById('fail').style.display='flex'; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  var scene=new THREE.Scene();
  var sky=new THREE.Color(0xcfe6f2);
  scene.background=sky;
  var camera=new THREE.PerspectiveCamera(70,1,0.05,200);
  camera.rotation.order='YXZ';

  /* ---------- bahan ---------- */
  var matCache={};
  function mat(c,o){ var k=c+(o?JSON.stringify(o):''); if(!matCache[k]) matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.9,metalness:0},o||{})); return matCache[k]; }
  var M={
    wall:mat(0xf1ece4), ceil:mat(0xf8f5ef),
    wood:mat(0xb88d62,{roughness:.7}), wood2:mat(0xc8a47a,{roughness:.7}),
    tile:mat(0xc9d3d6,{roughness:.5}), tile2:mat(0xd9d2c6,{roughness:.5}),
    ground:mat(0x9fae9b), corridor:mat(0xbdbab2),
    glass:new THREE.MeshStandardMaterial({color:0xbfe3f5,transparent:true,opacity:.32,roughness:.1})
  };
  var colliders=[];
  function boxM(x0,x1,z0,z1,y0,y1,m){
    var g=new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0), mesh=new THREE.Mesh(g,m);
    mesh.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2); scene.add(mesh); return mesh;
  }

  /* ---------- tanah luar ---------- */
  var gp=new THREE.Mesh(new THREE.PlaneGeometry(120,120),M.ground);
  gp.rotation.x=-Math.PI/2; gp.position.set(X(1340),-0.02,Z(730)); scene.add(gp);

  /* ---------- ruang (px pada pelan) ---------- */
  var rooms=[
    {n:'Bilik Tidur Utama',r:[[822,371,1088,752]],f:'wood',c:'#d8bf9b',lab:[955,590]},
    {n:'Bilik Air Utama',r:[[822,767,1088,907]],f:'tile',c:'#cfe0e6',lab:[955,840]},
    {n:'Ruang Tamu',r:[[1102,371,1358,690]],f:'wood2',c:'#e6cfae',lab:[1230,430]},
    {n:'Ruang Makan',r:[[1102,690,1358,990]],f:'wood2',c:'#e6cfae',lab:[1230,720]},
    {n:'Bilik Tidur 2',r:[[1373,371,1610,670]],f:'wood',c:'#d8bf9b',lab:[1490,540]},
    {n:'Bilik Tidur 1',r:[[1625,371,1867,780]],f:'wood',c:'#d8bf9b',lab:[1745,440]},
    {n:'Ruang Dalam',r:[[1372,686,1610,779]],f:'wood2',c:'#e6cfae',lab:[1490,735]},
    {n:'Bilik Air 1',r:[[1373,793,1610,925]],f:'tile',c:'#cfe0e6',lab:[1490,870]},
    {n:'Foyer',r:[[1102,990,1250,1092]],f:'tile2',c:'#e0d9cc',lab:[1176,1040]},
    {n:'Dapur',r:[[1264,990,1465,1092],[1365,940,1465,990]],f:'tile2',c:'#e0d9cc',lab:[1365,1020]},
    {n:'Yard',r:[[1485,945,1548,1092]],f:'tile',c:'#cfe0e6',lab:[1516,1010]}
  ];
  var ceilings=[];
  rooms.forEach(function(rm){
    rm.r.forEach(function(q){
      var w=(q[2]-q[0])*S, d=(q[3]-q[1])*S;
      var fl=new THREE.Mesh(new THREE.PlaneGeometry(w,d),M[rm.f]);
      fl.rotation.x=-Math.PI/2; fl.position.set(X((q[0]+q[2])/2),0.0,Z((q[1]+q[3])/2)); scene.add(fl);
      var ce=new THREE.Mesh(new THREE.PlaneGeometry(w,d),M.ceil);
      ce.rotation.x=Math.PI/2; ce.position.set(X((q[0]+q[2])/2),WH,Z((q[1]+q[3])/2)); scene.add(ce); ceilings.push(ce);
    });
  });
  // koridor luar di depan pintu masuk
  var cor=new THREE.Mesh(new THREE.PlaneGeometry(2.6,1.6),M.corridor);
  cor.rotation.x=-Math.PI/2; cor.position.set(X(1176),0.0,Z(1100)+0.9); scene.add(cor);
  // koridor luar: pagar rendah dan sempadan supaya tidak berjalan keluar jauh
  (function(){
    var xa=X(1176)-1.3, xb=X(1176)+1.3, z0=Z(1100), z1=z0+1.6, rail=mat(0x8f8c85);
    boxM(xa,xb,z1-0.05,z1,0,0.95,rail); boxM(xa,xa+0.05,z0,z1,0,0.95,rail); boxM(xb-0.05,xb,z0,z1,0,0.95,rail);
    colliders.push({x0:xa-0.3,x1:xb+0.3,z0:z1,z1:z1+0.3},{x0:xa-0.3,x1:xa,z0:z0,z1:z1+0.3},{x0:xb,x1:xb+0.3,z0:z0,z1:z1+0.3});
  })();
  // ruang AC (tidak boleh dimasuki)
  boxM(X(1566),X(1612),Z(945),Z(1092),0,2.3,mat(0xdfe3e5));

  /* ---------- dinding: [x1,y1,x2,y2,tebal,{doors,windows}] ---------- */
  var walls=[
    [815,363,1875,363,.2,{windows:[[885,1022],[1160,1298],[1424,1558],[1678,1813]]}],
    [1875,363,1875,786,.2],
    [1617,786,1875,786,.2],
    [1617,786,1617,1100,.2],
    [1095,1100,1617,1100,.2,{doors:[[1130,1225]]}],
    [1095,363,1095,1100,.2,{doors:[[650,745]]}],
    [815,913,1095,913,.2],
    [815,363,815,913,.2],
    [815,760,1095,760,.12,{doors:[[925,1030]]}],
    [1365,363,1365,678,.12],
    [1365,678,1617,678,.12,{doors:[[1385,1462]]}],
    [1617,363,1617,786,.12,{doors:[[692,776]]}],
    [1365,786,1617,786,.12,{doors:[[1540,1600]]}],
    [1365,786,1365,932,.12],
    [1365,932,1617,932,.12],
    [1472,932,1472,1100,.12,{doors:[[955,1030]]}],
    [1557,932,1557,1100,.12],
    [1257,992,1257,1100,.12]
  ];
  function addWall(w){
    var x1=w[0],y1=w[1],x2=w[2],y2=w[3],t=w[4],o=w[5]||{};
    var horiz=(y1===y2), ext=(t/2)/S;
    var a=horiz?Math.min(x1,x2):Math.min(y1,y2), b=horiz?Math.max(x1,x2):Math.max(y1,y2);
    var fixed=horiz?y1:x1, A=a-ext, B=b+ext;
    var doors=(o.doors||[]).map(function(d){return {a:d[0],b:d[1],y0:0,y1:2.1,t:'d'};});
    var wins=(o.windows||[]).map(function(d){return {a:d[0],b:d[1],y0:.9,y1:2.1,t:'w'};});
    var cuts=doors.concat(wins).sort(function(p,q){return p.a-q.a;});
    function piece(s,e,y0,y1){
      if(e-s<0.5||y1-y0<=0) return;
      if(horiz) boxM(X(s),X(e),Z(fixed)-t/2,Z(fixed)+t/2,y0,y1,M.wall);
      else boxM(X(fixed)-t/2,X(fixed)+t/2,Z(s),Z(e),y0,y1,M.wall);
    }
    function glass(s,e){
      var len=(e-s)*S, g=new THREE.Mesh(new THREE.BoxGeometry(horiz?len:0.03,1.2,horiz?0.03:len),M.glass);
      var cx=horiz?X((s+e)/2):X(fixed), cz=horiz?Z(fixed):Z((s+e)/2);
      g.position.set(cx,1.5,cz); scene.add(g);
      // bingkai tengah
      var fr=new THREE.Mesh(new THREE.BoxGeometry(horiz?0.05:0.06,1.2,horiz?0.06:0.05),mat(0xffffff));
      fr.position.set(cx,1.5,cz); scene.add(fr);
    }
    var cur=A;
    cuts.forEach(function(c){
      piece(cur,c.a,0,WH);
      if(c.y0>0) piece(c.a,c.b,0,c.y0);
      piece(c.a,c.b,c.y1,WH);
      if(c.t==='w') glass(c.a,c.b);
      cur=c.b;
    });
    piece(cur,B,0,WH);
    function col(s,e){
      if(e-s<1) return;
      if(horiz) colliders.push({x0:X(s),x1:X(e),z0:Z(fixed)-t/2,z1:Z(fixed)+t/2});
      else colliders.push({x0:X(fixed)-t/2,x1:X(fixed)+t/2,z0:Z(s),z1:Z(e)});
    }
    var cc=A; doors.slice().sort(function(p,q){return p.a-q.a;}).forEach(function(d){col(cc,d.a);cc=d.b;});
    col(cc,B);
  }
  walls.forEach(addWall);

  /* ---------- perabot (px pada pelan, tinggi dalam meter) ---------- */
  function furn(cx,cy,w,d,h,color,opt){
    opt=opt||{}; var y0=opt.y0||0, solid=(opt.solid!==false);
    var x0=X(cx-w/2),x1=X(cx+w/2),z0=Z(cy-d/2),z1=Z(cy+d/2);
    boxM(x0,x1,z0,z1,y0,y0+h,mat(color));
    if(solid&&y0<0.6) colliders.push({x0:x0,x1:x1,z0:z0,z1:z1});
  }
  var NS={solid:false};
  // bilik tidur utama
  furn(950,500,172,200,.45,0x8d7b6b); furn(950,505,164,185,.18,0xf3efe8,{y0:.45,solid:false});
  furn(950,376,176,10,1.05,0x6b5a4c); furn(910,402,55,30,.12,0xffffff,{y0:.63,solid:false}); furn(990,402,55,30,.12,0xffffff,{y0:.63,solid:false});
  furn(950,550,164,90,.05,0x3f6f68,{y0:.63,solid:false});
  furn(840,392,40,40,.5,0x7a6657); furn(1060,392,40,40,.5,0x7a6657);
  furn(868,725,100,50,2.2,0x9a8672);
  // bilik air utama
  furn(1058,875,34,46,.4,0xffffff); furn(1058,895,34,14,.8,0xffffff); furn(955,888,56,36,.85,0xf5f5f5);
  furn(870,820,100,100,.04,0xb8c4c8,NS);
  // ruang tamu
  furn(1250,500,150,200,.02,0xc9b79c,NS);
  furn(1150,500,84,190,.45,0x5b6b73); furn(1117,500,14,190,.95,0x4d5b62);
  furn(1150,415,84,14,.65,0x4d5b62); furn(1150,585,84,14,.65,0x4d5b62);
  furn(1250,500,58,95,.4,0xb89b78);
  furn(1340,500,24,150,.5,0x3b3a38); furn(1344,500,6,115,.65,0x101010,{y0:.55,solid:false});
  // ruang makan
  furn(1230,830,130,86,.75,0x8a6a4a);
  [[1195,775],[1265,775],[1195,885],[1265,885],[1148,830],[1312,830]].forEach(function(p){furn(p[0],p[1],34,34,.5,0x6b5a4c);});
  // dapur
  furn(1365,1082,210,38,.9,0xdedad2); furn(1365,1082,210,38,.04,0x4a4a48,{y0:.9,solid:false});
  furn(1280,1040,26,80,.9,0xdedad2); furn(1445,1070,34,44,1.8,0xc7ccd0);
  furn(1365,1090,210,22,.7,0xcfcac1,{y0:1.5,solid:false});
  // foyer
  furn(1241,1052,16,64,1.0,0x8a6a4a);
  // bilik tidur 2
  furn(1535,480,102,196,.45,0x8d7b6b); furn(1535,485,96,185,.16,0xf3efe8,{y0:.45,solid:false}); furn(1535,376,106,8,.95,0x6b5a4c);
  furn(1410,385,76,36,.75,0x9a8672); furn(1410,425,32,32,.5,0x4d5b62); furn(1560,645,90,44,2.1,0x9a8672);
  // bilik tidur 1
  furn(1750,540,196,172,.45,0x8d7b6b); furn(1745,540,185,160,.16,0xf3efe8,{y0:.45,solid:false}); furn(1860,540,8,176,1.0,0x6b5a4c);
  furn(1750,760,150,40,2.2,0x9a8672);
  // bilik air 1
  furn(1585,890,34,46,.4,0xffffff); furn(1500,905,56,36,.85,0xf5f5f5); furn(1420,860,80,100,.04,0xb8c4c8,NS);
  // yard
  furn(1515,1060,40,40,.9,0xe8eaec); furn(1588,1010,0.1,0.1,0.1,0xffffff,NS);

  /* ---------- label ruang ---------- */
  function label(text,px,py){
    var c=document.createElement('canvas'); c.width=320; c.height=80; var g=c.getContext('2d');
    g.fillStyle='rgba(20,28,26,.72)'; var r=14; g.beginPath(); g.moveTo(r,6); g.arcTo(314,6,314,74,r); g.arcTo(314,74,6,74,r); g.arcTo(6,74,6,6,r); g.arcTo(6,6,314,6,r); g.fill();
    g.fillStyle='#fff'; g.font='600 30px "Public Sans",system-ui,sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,160,41);
    var t=new THREE.CanvasTexture(c); var s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));
    s.scale.set(1.5,0.375,1); s.position.set(X(px),2.3,Z(py)); scene.add(s); return s;
  }
  var labels=rooms.map(function(rm){return label(rm.n,rm.lab[0],rm.lab[1]);});
  var doorLabel=label('Pintu masuk',1176,1085); doorLabel.position.y=2.05;

  /* ---------- cahaya ---------- */
  scene.add(new THREE.HemisphereLight(0xffffff,0xb8b2a6,0.6));
  var sun=new THREE.DirectionalLight(0xfff4e0,0.25); sun.position.set(-6,12,-4); scene.add(sun);
  [[955,560],[1230,540],[1230,850],[1490,540],[1745,560],[1365,1030],[1490,735]].forEach(function(p){
    var l=new THREE.PointLight(0xfff2dc,0.18,7,1.6); l.position.set(X(p[0]),2.4,Z(p[1])); scene.add(l);
  });

  /* ---------- pemain ---------- */
  var player={x:X(1165),z:Z(1048),yaw:0,pitch:0,bob:0};
  var topView=false;
  var keys={}, joy={x:0,y:0};
  function blocked(x,z){
    for(var i=0;i<colliders.length;i++){
      var c=colliders[i];
      if(x>c.x0-RAD&&x<c.x1+RAD&&z>c.z0-RAD&&z<c.z1+RAD) return true;
    }
    return false;
  }
  function step(dx,dz){
    var nx=player.x+dx, nz=player.z+dz;
    if(!blocked(nx,player.z)) player.x=nx;
    if(!blocked(player.x,nz)) player.z=nz;
  }
  addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true; if(e.key.indexOf('Arrow')===0) e.preventDefault();});
  addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
  addEventListener('blur',function(){keys={};});

  var drag=null;
  canvas.addEventListener('pointerdown',function(e){ drag={id:e.pointerId,x:e.clientX,y:e.clientY}; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove',function(e){
    if(!drag||drag.id!==e.pointerId||topView) return;
    player.yaw-=(e.clientX-drag.x)*0.005;
    player.pitch=Math.max(-1.2,Math.min(1.2,player.pitch-(e.clientY-drag.y)*0.004));
    drag.x=e.clientX; drag.y=e.clientY;
  });
  function endDrag(e){ if(drag&&drag.id===e.pointerId) drag=null; }
  canvas.addEventListener('pointerup',endDrag); canvas.addEventListener('pointercancel',endDrag);

  var joyEl=document.getElementById('joy'), knob=document.getElementById('knob'), jid=null;
  function joyMove(e){
    var r=joyEl.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    var dx=(e.clientX-cx)/(r.width/2), dy=(e.clientY-cy)/(r.height/2), m=Math.hypot(dx,dy);
    if(m>1){dx/=m;dy/=m;}
    joy.x=dx; joy.y=dy; knob.style.transform='translate('+(dx*34)+'px,'+(dy*34)+'px)';
  }
  joyEl.addEventListener('pointerdown',function(e){jid=e.pointerId;joyEl.setPointerCapture(jid);joyMove(e);});
  joyEl.addEventListener('pointermove',function(e){if(e.pointerId===jid) joyMove(e);});
  function joyEnd(e){ if(e.pointerId===jid){jid=null;joy.x=0;joy.y=0;knob.style.transform='';} }
  joyEl.addEventListener('pointerup',joyEnd); joyEl.addEventListener('pointercancel',joyEnd);

  /* ---------- UI: chip ruang, mod, petunjuk ---------- */
  var spawns=[
    ['Foyer',1165,1048,0],
    ['Ruang Tamu',1240,655,0],
    ['Ruang Makan',1180,945,0],
    ['Dapur',1330,1045,Math.PI],
    ['Bilik Tidur Utama',1005,700,0],
    ['Bilik Tidur 2',1500,630,0],
    ['Bilik Tidur 1',1700,700,0],
    ['Bilik Air Utama',960,830,0]
  ];
  var chipsEl=document.getElementById('chips');
  spawns.forEach(function(s,i){
    var b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=s[0]; b.setAttribute('aria-pressed',i===0?'true':'false');
    b.addEventListener('click',function(){
      setTop(false);
      player.x=X(s[1]); player.z=Z(s[2]); player.yaw=s[3]; player.pitch=0;
      Array.prototype.forEach.call(chipsEl.children,function(c){c.setAttribute('aria-pressed',c===b?'true':'false');});
    });
    chipsEl.appendChild(b);
  });
  var coarse=window.matchMedia&&matchMedia('(pointer: coarse)').matches;
  var hint=document.getElementById('hint');
  function setHint(){ hint.textContent=topView?'Pandangan atas: lihat susun atur seluruh unit. Tekan "Berjalan" untuk kembali.':(coarse?'Seret skrin untuk melihat sekeliling. Guna bulatan di kiri bawah untuk bergerak.':'Seret tetikus untuk melihat sekeliling. W A S D atau anak panah untuk bergerak, Shift untuk berlari.'); }
  var modeBtn=document.getElementById('mode');
  function setTop(v){
    topView=v; modeBtn.textContent=v?'Berjalan':'Pandangan atas';
    ceilings.forEach(function(c){c.visible=!v;});
    labels.forEach(function(l){l.position.y=v?0.6:2.3;});
    doorLabel.position.y=v?0.5:2.05;
    setHint();
  }
  modeBtn.addEventListener('click',function(){setTop(!topView);});
  setHint();

  /* ---------- minimap ---------- */
  var mm=document.getElementById('mm'), mg=mm.getContext('2d');
  var MX0=800, MY0=350, MW=1090, MH=765, MS=mm.width/MW;
  function mx(px){return (px-MX0)*MS;} function my(py){return (py-MY0)*MS;}
  function drawMap(){
    var cs=getComputedStyle(document.documentElement);
    mg.clearRect(0,0,mm.width,mm.height);
    mg.fillStyle=document.documentElement.getAttribute('data-theme')==='dark'||(matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.getAttribute('data-theme')!=='light')?'#1c2324':'#f6f3ec';
    mg.fillRect(0,0,mm.width,mm.height);
    rooms.forEach(function(rm){ mg.fillStyle=rm.c; rm.r.forEach(function(q){mg.fillRect(mx(q[0]),my(q[1]),(q[2]-q[0])*MS,(q[3]-q[1])*MS);}); });
    walls.forEach(function(w){
      var horiz=w[1]===w[3], t=w[4], o=w[5]||{}, a=horiz?Math.min(w[0],w[2]):Math.min(w[1],w[3]), b=horiz?Math.max(w[0],w[2]):Math.max(w[1],w[3]), f=horiz?w[1]:w[0];
      var gaps=(o.doors||[]).map(function(d){return {a:d[0],b:d[1],c:null};}).concat((o.windows||[]).map(function(d){return {a:d[0],b:d[1],c:'#58a6d8'};})).sort(function(p,q){return p.a-q.a;});
      function seg(s,e,col){ mg.strokeStyle=col; mg.lineWidth=Math.max(2,t/S*MS*0.55);
        mg.beginPath(); if(horiz){mg.moveTo(mx(s),my(f));mg.lineTo(mx(e),my(f));}else{mg.moveTo(mx(f),my(s));mg.lineTo(mx(f),my(e));} mg.stroke(); }
      var cur=a; gaps.forEach(function(g){ seg(cur,g.a,'#4a4540'); if(g.c) seg(g.a,g.b,g.c); cur=g.b; }); seg(cur,b,'#4a4540');
    });
    var px=player.x/S+OX, py=player.z/S+OY;
    mg.save(); mg.translate(mx(px),my(py)); mg.rotate(-player.yaw);
    mg.fillStyle='rgba(23,105,93,.28)'; mg.beginPath(); mg.moveTo(0,0); mg.arc(0,0,46,-Math.PI/2-0.6,-Math.PI/2+0.6); mg.closePath(); mg.fill();
    mg.fillStyle='#d6402a'; mg.beginPath(); mg.arc(0,0,7,0,Math.PI*2); mg.fill(); mg.restore();
  }
  var roomEl=document.getElementById('room');
  function currentRoom(){
    var px=player.x/S+OX, py=player.z/S+OY;
    for(var i=0;i<rooms.length;i++) for(var j=0;j<rooms[i].r.length;j++){ var q=rooms[i].r[j]; if(px>=q[0]&&px<=q[2]&&py>=q[1]&&py<=q[3]) return rooms[i].n; }
    return py>1100?'Koridor luar':'Laluan';
  }

  /* ---------- saiz & gelung ---------- */
  function resize(){
    var w=canvas.clientWidth||innerWidth, h=canvas.clientHeight||innerHeight;
    renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  }
  addEventListener('resize',resize); resize();
  var last=performance.now(), lastRoom='';
  function frame(now){
    var dt=Math.min(0.05,(now-last)/1000); last=now;
    if(!topView){
      var run=keys['shift']?2:1, f=0,s=0;
      if(keys['w']||keys['arrowup']) f+=1; if(keys['s']||keys['arrowdown']) f-=1;
      if(keys['d']) s+=1; if(keys['a']) s-=1;
      if(keys['arrowleft']) player.yaw+=1.6*dt; if(keys['arrowright']) player.yaw-=1.6*dt;
      f+=-joy.y; s+=joy.x;
      var len=Math.hypot(f,s); if(len>1){f/=len;s/=len;}
      var sp=1.5*run*dt, sy=Math.sin(player.yaw), cy=Math.cos(player.yaw);
      step((-sy*f+cy*s)*sp,(-cy*f-sy*s)*sp);
      player.bob+=Math.hypot(f,s)*sp*7;
      camera.position.set(player.x,EYE+Math.sin(player.bob)*0.012,player.z);
      camera.rotation.set(player.pitch,player.yaw,0);
      camera.fov=70;
    } else {
      camera.position.set(X(1340),19,Z(735)); camera.rotation.set(-Math.PI/2,0,0); camera.fov=48;
    }
    camera.updateProjectionMatrix();
    var rn=currentRoom(); if(rn!==lastRoom){roomEl.textContent=rn; lastRoom=rn;}
    drawMap(); renderer.render(scene,camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__walk={player:player,setTop:setTop,spawns:spawns,step:step,blocked:blocked,X:X,Z:Z};
})();
</script>

</body>
</html>
